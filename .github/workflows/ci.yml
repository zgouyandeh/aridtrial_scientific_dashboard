name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aridtrial
          POSTGRES_PASSWORD: aridtrial
          POSTGRES_DB: aridtrial_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aridtrial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUTF8: "1"
      ARIDTRIAL_TEST_DSN: postgresql+psycopg2://aridtrial:aridtrial@localhost:5432/aridtrial_test
      ARIDTRIAL_TEST_DSN2: postgresql+psycopg2://aridtrial:aridtrial@localhost:5432/aridtrial_test2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create the second test database
        run: PGPASSWORD=aridtrial psql -h localhost -U aridtrial -d aridtrial_test -c "CREATE DATABASE aridtrial_test2"
      - run: pip install -e ".[dev,dashboard]"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build (live mode and static-snapshot mode)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          VITE_STATIC=1 npm run build
